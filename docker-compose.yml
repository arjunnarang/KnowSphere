services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: know-sphere-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: knowspheredb
      POSTGRES_USER: Arjun
      POSTGRES_PASSWORD: dummy

    volumes:
      - knowspheredata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d knowsphere" ]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  knowspheredata: